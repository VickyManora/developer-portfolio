<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family:'Geist Sans'; src:url('../../public/fonts/geist-sans-600.woff2') format('woff2'); font-weight:600; }
  @font-face { font-family:'Inter'; src:url('../../public/fonts/inter-400.woff2') format('woff2'); font-weight:400; }
  @font-face { font-family:'Geist Mono'; src:url('../../public/fonts/geist-mono-400.woff2') format('woff2'); font-weight:400; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#08090C;color:#EDEFF3;
       font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(to right,rgba(255,255,255,.03) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(255,255,255,.03) 1px,transparent 1px);
    background-size:60px 60px;
    -webkit-mask-image:radial-gradient(90% 80% at 70% 40%,#000,transparent 78%)}
  .field{position:absolute;inset:0;
    background:radial-gradient(50% 45% at 76% 32%,rgba(77,141,255,.16),transparent 70%),
               radial-gradient(38% 36% at 22% 78%,rgba(94,233,208,.09),transparent 72%)}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .edge{stroke:#3F4D68;stroke-width:1;opacity:.55}
  .node{fill:#7A828F;opacity:.6}
  .node.key{fill:#C3CAD6;opacity:.85}
  .sig{fill:#4D8DFF}
  .content{position:absolute;left:72px;top:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:22px;z-index:2;max-width:660px}
  .eyebrow{font-family:'Geist Mono',monospace;font-size:17px;letter-spacing:.16em;text-transform:uppercase;color:#7A828F;display:flex;gap:12px;align-items:center;white-space:nowrap}
  .eyebrow b{color:#4D8DFF;font-weight:400}
  h1{font-family:'Geist Sans',sans-serif;font-weight:600;font-size:82px;line-height:1.02;letter-spacing:-.035em}
  .lede{font-size:26px;line-height:1.5;color:#9AA1AE;max-width:22ch}
  .chips{display:flex;gap:10px;margin-top:6px}
  .chip{font-family:'Geist Mono',monospace;font-size:15px;letter-spacing:.05em;color:#9AA1AE;
        border:1px solid rgba(255,255,255,.09);background:#14171E;border-radius:6px;padding:8px 12px}
  .rule{position:absolute;left:72px;top:88px;width:44px;height:2px;background:linear-gradient(90deg,#4D8DFF,#5EE9D0)}
  .scrim{position:absolute;inset:0;background:linear-gradient(to right,#08090C 0%,rgba(8,9,12,.92) 34%,rgba(8,9,12,.35) 60%,transparent 78%)}
</style></head>
<body>
  <div class="grid"></div><div class="field"></div>
  <svg viewBox="0 0 1200 630" id="g"></svg>
  <div class="scrim"></div>
  <div class="rule"></div>
  <div class="content">
    <p class="eyebrow"><b>01</b> / Senior Full Stack Engineer</p>
    <h1>Vicky Manora</h1>
    <p class="lede">Secure, high-performance web applications — frontend architecture to cloud.</p>
    <div class="chips"><span class="chip">ANGULAR</span><span class="chip">REACT</span><span class="chip">NODE.JS</span><span class="chip">AWS · AZURE</span></div>
  </div>
<script>
// The same four-strata lattice as the site's system-core, drawn deterministically.
const S=[{y:150,n:9},{y:250,n:11},{y:350,n:8},{y:450,n:6}];
const pts=S.map(s=>Array.from({length:s.n},(_,i)=>({x:560+ (i/(s.n-1))*580, y:s.y, key:i%3===1})));
let out='';
for(let l=0;l<pts.length-1;l++)for(const a of pts[l]){
  const near=[...pts[l+1]].sort((p,q)=>Math.abs(p.x-a.x)-Math.abs(q.x-a.x)).slice(0,2);
  for(const b of near) out+=`<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
}
for(const layer of pts)for(const p of layer) out+=`<rect class="node${p.key?' key':''}" x="${p.x-3}" y="${p.y-3}" width="6" height="6" rx="1"/>`;
for(const p of [pts[0][3],pts[1][7],pts[2][2],pts[3][4]]) out+=`<circle class="sig" cx="${p.x}" cy="${p.y}" r="4.5"/>`;
document.getElementById('g').innerHTML=out;
</script>
</body></html>

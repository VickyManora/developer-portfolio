<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vicky Manora — Senior Full Stack Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="Vicky Manora" />
    <meta name="theme-color" content="#08090c" />
    <meta name="color-scheme" content="dark light" />

    <!-- Only the two faces used above the fold are preloaded: the H1 display
         weight and the body regular. Preloading all four would compete with
         the LCP text for bandwidth. -->
    <link
      rel="preload"
      href="/fonts/geist-sans-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Ordered so each browser stops at the best form it understands: the
         .ico carries 16/32/48 for older browsers, the SVG wins wherever it is
         supported and stays crisp on any display. Generated by
         tools/icons/generate-icons.mjs from tools/icons/icon.svg. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

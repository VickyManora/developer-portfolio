<div class="backdrop__grid"></div>
<div class="backdrop__field"></div>

<svg
  class="backdrop__svg"
  [attr.viewBox]="viewBox"
  preserveAspectRatio="xMidYMid slice"
  role="presentation"
  focusable="false"
>
  <g class="backdrop__strata">
    @for (y of strataY; track y) {
      <line x1="40" [attr.y1]="y" x2="1560" [attr.y2]="y" />
    }
  </g>

  <g class="backdrop__edges">
    @for (edge of edges; track $index) {
      <line [attr.x1]="edge.x1" [attr.y1]="edge.y1" [attr.x2]="edge.x2" [attr.y2]="edge.y2" />
    }
  </g>

  <g class="backdrop__nodes">
    @for (node of nodes; track $index) {
      <rect
        [attr.x]="node.x - 2.5"
        [attr.y]="node.y - 2.5"
        width="5"
        height="5"
        rx="1"
        [class.is-key]="node.key"
      />
    }
  </g>

  <g class="backdrop__signals">
    @for (node of signals; track $index) {
      <circle [attr.cx]="node.x" [attr.cy]="node.y" r="3.5" />
    }
  </g>
</svg>

<div class="backdrop__fade"></div>
